<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <title>Calories</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="day">
        <button class="nav" id="prev" aria-label="Previous day">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <h1 id="day-label">Today</h1>
        <button class="nav" id="next" aria-label="Next day">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <button class="add-btn" id="open-add" aria-label="Add food">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <section class="summary">
      <div class="kcal">
        <strong id="cal-total">0</strong>
        <span id="cal-sub">kcal</span>
      </div>
      <div class="bar big"><i id="cal-bar"></i></div>
      <div class="macros">
        <div class="macro" data-key="protein"><span class="label">Protein</span><span class="val"></span><div class="bar"><i></i></div></div>
        <div class="macro" data-key="carbs"><span class="label">Carbs</span><span class="val"></span><div class="bar"><i></i></div></div>
        <div class="macro" data-key="fat"><span class="label">Fat</span><span class="val"></span><div class="bar"><i></i></div></div>
      </div>
    </section>

    <section class="list">
      <ul id="items"></ul>
      <p class="empty" id="empty">
        Nothing logged yet.<br>Tap <b>+</b> to add food.
      </p>
    </section>

    <footer class="foot">
      <button class="link" id="go-today" hidden>Back to today</button>
      <button class="link" id="open-goals">Daily goals</button>
    </footer>
  </main>

  <dialog id="food-dialog">
    <form id="food-form" autocomplete="off" novalidate>
      <h2 id="food-title">Add food</h2>
      <label class="field">
        <span>Name</span>
        <input name="name" list="foods" placeholder="e.g. Chicken wrap" maxlength="100" enterkeyhint="next">
      </label>
      <div class="grid">
        <label class="field"><span>Calories</span><input name="calories" inputmode="decimal" placeholder="0"></label>
        <label class="field"><span>Protein (g)</span><input name="protein" inputmode="decimal" placeholder="0"></label>
        <label class="field"><span>Carbs (g)</span><input name="carbs" inputmode="decimal" placeholder="0"></label>
        <label class="field"><span>Fat (g)</span><input name="fat" inputmode="decimal" placeholder="0"></label>
      </div>
      <p class="error" id="food-error" hidden></p>
      <div class="actions">
        <button type="button" class="danger" id="delete-food" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary" id="food-submit">Add</button>
      </div>
    </form>
    <datalist id="foods"></datalist>
  </dialog>

  <dialog id="goals-dialog">
    <form id="goals-form" autocomplete="off" novalidate>
      <h2>Daily goals</h2>
      <div class="grid">
        <label class="field"><span>Calories</span><input name="calories" inputmode="decimal"></label>
        <label class="field"><span>Protein (g)</span><input name="protein" inputmode="decimal"></label>
        <label class="field"><span>Carbs (g)</span><input name="carbs" inputmode="decimal"></label>
        <label class="field"><span>Fat (g)</span><input name="fat" inputmode="decimal"></label>
      </div>
      <div class="actions">
        <span class="spacer"></span>
        <button type="button" class="ghost" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
